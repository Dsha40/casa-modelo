# Configuración del modo Anaqueles (interacción con los niveles del estante).
#
# SOLO se leen las claves pre-declaradas en anaqueles.py:_DEFECTOS (mismo
# patrón que permanencia_config.yaml): una clave nueva sin declarar en el
# código se descarta en silencio.
#
# Las áreas NO se configuran aquí: las dibuja el operador en el cliente de
# tienda y viajan en cada frame (patrón PermanenciaArea, no el YAML del
# stand).

# ── Visita: la persona se DETIENE frente al nivel (v2, 14-ago) ──────────
# Segundos QUIETO frente al área para contar UNA visita. Pasar caminando
# junto al estante NO cuenta: el dwell solo corre con el cuerpo quieto.
visita_dwell_s: 1.5
# La misma persona en el mismo nivel no re-cuenta visita hasta pasar esto.
visita_cooldown_s: 120
# Fracción mínima de la franja superior del cuerpo que debe pisar el área:
# el roce de quien va por el medio del pasillo no abre compuerta.
visita_solape_min: 0.15

# ── Quietud (v2): «estar» vs «pasar» ────────────────────────────────────
# Velocidad máxima del cuerpo para «quieto», en ANCHOS DE SU PROPIO BBOX
# por segundo (caminar ≈ 1.5-3; parado con vaivén < 0.3).
quieto_max_vel: 0.45
# Ventana (s) para estimar la velocidad.
quieto_ventana_s: 1.0

# ── Dedup espacial anti-fragmentos (v2/v3) ──────────────────────────────
# A 2-3 FPS los tracks se parten con las oclusiones y la MISMA persona
# recibe un id nuevo: mismo sitio (este radio, en anchos de bbox) dentro
# de la ventana = la misma persona, no se re-cuenta. Dos tracks que
# COEXISTEN en el frame jamás son fragmentos (el acompañante sí cuenta).
dedup_espacial_frac: 0.8
# Ventana para un sitio VACANTE (el horizonte real en que un track partido
# renace). Mientras la persona SIGUE ahí, su entrada se refresca sola.
dedup_espacial_ventana_s: 20

# ── Agarre: un GESTO de la muñeca, no una presencia ─────────────────────
# Corregido el 14-ago: una persona PARADA frente al estante se proyecta
# sobre el polígono y su muñeca colgando quedaba «dentro» — contaba un
# agarre falso cada cooldown, para siempre. Ahora el agarre exige la
# TRANSICIÓN fuera → dentro profundo, y tras contar hay que sacar la mano
# para poder contar otro.
#
# Frames consecutivos con la muñeca PROFUNDA (a 2-3 FPS efectivos, un
# agarre entero dura 2-6 frames: no subir esto sin medir).
agarre_frames_min: 2
# Lo mismo en SEGUNDOS (5-oct-2026): se exige lo MAYOR entre los frames de
# arriba y este tiempo a los fps medidos. A ~5-8 fps da 2 frames, como
# siempre; a 15 fps, 4. 0 = solo frames. (ritmo_imagenes.py)
agarre_min_s: 0.25
# La misma persona en el mismo nivel no re-cuenta agarre hasta pasar esto.
agarre_cooldown_s: 10
# Penetración de la muñeca (v3: ESCALA con la persona): fracción del ancho
# de su bbox, acotada entre 4 px y el tope de abajo, y nunca más del 40%
# del alto del nivel dibujado. Histéresis = la mitad.
agarre_profundidad_frac: 0.08
agarre_profundidad_px: 12
# Frames seguidos fuera/superficial para RE-ARMAR el gesto.
agarre_rearme_frames: 2
# Lo mismo en SEGUNDOS, con la misma regla que agarre_min_s.
agarre_rearme_s: 0.25
# Segundos QUIETO antes de poder contar (v2: quien camina a lo largo del
# estante pasaba >1.2 s «en compuerta» y su braceo hacía el patrón entero;
# un agarre real ocurre PARADO).
agarre_asentamiento_s: 1.2
# Amplitud mínima del gesto (fracción del ancho del bbox): la mano debe
# VIAJAR desde fuera hasta dentro; el temblor de la muñeca colgando
# alrededor del borde no llega.
agarre_amplitud_min: 0.30
# Desde dónde se mide ese viaje (cambiado el 29-sep-2026).
#   ANTES: agarre_amplitud_desde: ultimo  → desde la ÚLTIMA vez que se vio
#          la mano fuera. Si esa muestra iba rozando el borde (-3 px), el
#          viaje salía corto aunque la mano viniera de lejos.
#   AHORA: extremo → desde el punto MÁS alejado en que se vio fuera.
agarre_amplitud_desde: extremo
# Confianza mínima del keypoint de muñeca (calibrado en la degustación).
conf_muneca_min: 0.30
# Pose como mucho para estas personas por frame (las más cercanas).
pose_max_personas: 4
# A quién se le mira la muñeca (cambiado el 29-sep-2026).
#   ANTES: pose_cercania: false → solo a quien está QUIETO pisando el área.
#          Al alargar el brazo el cuerpo se mueve, y con una balda por
#          encima de la cabeza la persona ni siquiera pisa el área hasta
#          subir el brazo: la máquina dejaba de mirar justo cuando entraba
#          la mano y no contaba el agarre.
#   AHORA: true → también a quien está CERCA del área (debajo o delante),
#          aunque se mueva. Contar un agarre sigue exigiendo lo mismo.
#   Medido el 28-sep con la grabación del 23-sep de la cámara 3 (clienta
#   cogiendo Coffee-mate de la balda alta): con los valores de ANTES, 0
#   agarres; con estos dos, 2, los dos reales (revisados en imagen) y
#   repetido en vivo dos veces. Coste: la pose se calcula ~8 veces más a
#   menudo; con alguien delante del estante, ~15-20 ms más por frame.
#   AÚN NO MEDIDO en las cámaras en vivo: si aparecen agarres que no
#   ocurrieron, volver a los dos valores de ANTES.
pose_cercania: true
# «Cerca» = su caja solapa el área en horizontal y su borde de arriba no
# queda más abajo del área que esta fracción de su propia altura.
cercania_frac_alto: 0.5

# ── Geometría ───────────────────────────────────────────────────────────
# Fracción SUPERIOR del bbox que cuenta como «alcanza el estante».
franja_superior: 0.60

# ── Salud y escena ──────────────────────────────────────────────────────
# Aviso si lleva tanto (s) sin ver NI UNA persona (¿canal de iVMS correcto?).
aviso_sin_personas_s: 900
# Tras un cambio de escena confirmado, cuánto (s) NO contar.
escena_estabilizacion_s: 3.0

# ── Ritmos del bloque en vivo ───────────────────────────────────────────
periodo_contadores_s: 2.0
periodo_salud_s: 10.0
periodo_heatmap_s: 30.0

# ── Personal enrolado (14-ago) ──────────────────────────────────────────
# El personal (seguridad/pasilleros con foto en /api/personal) NO cuenta en
# el marketing; en su lugar emite alertas operativas con estos cooldowns.
alerta_seguridad_cooldown_s: 300
alerta_surte_cooldown_s: 180
# Segundos seguidos tocando un area para «esta surtiendo» (mas largo que la
# visita de un cliente: rozar el area caminando no es surtir).
surte_dwell_s: 3.0
# Aviso de «posible agotado» tras un agarre (anaqueles_stock.py). false =
# no se vigila nada (6-oct-2026, para la A/B de fps con y sin stock).
stock_activo: true

# ── Overrides por cámara (el camera_id literal del cliente) ─────────────
# camaras:
#   win-iVMS-4200:
#     franja_superior: 0.5
#
# OJO: la clave es el camera_id EXACTO, con el sufijo de la instalación
# (`-i58bf7b`), y los nombres cambian a menudo (título de la ventana, número
# de canal, instalación). Si el nombre no coincide, el bloque se IGNORA sin
# avisar. Por eso lo que vale para todas las cámaras va arriba, como norma
# general: aquí solo excepciones de verdad. (El 28-sep hubo aquí un bloque
# para `win-Media_Player-c3-i58bf7b` con `pose_cercania` y
# `agarre_amplitud_desde`; el 29-sep se pasaron a la norma general.)
camaras: {}
